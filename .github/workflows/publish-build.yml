name: Publish build to build_branch

# Rebuilds the customer app as static web assets on every push to main and
# publishes them to build_branch, overwriting its history each time -- same
# pattern as town-shoppy-admin's own publish-build.yml. Forge deploys
# customer.townshoppy.com as a Static HTML site straight from build_branch,
# no build step on the server.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.6"
          channel: stable

      - run: flutter pub get

      - name: Build web
        env:
          # Baked into the compiled JS at build time -- update here if the
          # production API domain ever changes, then push to main.
          API_BASE_URL: https://api.townshoppy.com/api/v1
          # Merchant web app origin (no trailing slash): Business mode opens its
          # subscribe page in the browser for package checkout.
          MERCHANT_WEB_URL: https://app.townshoppy.com
          # This app's own hosted origin -- used to build the shareable
          # product link sent in a "Order via WhatsApp" message.
          CUSTOMER_WEB_URL: https://customer.townshoppy.com
        # --pwa-strategy=none: no caching service worker. With one, a
        # browser that had opened the app before kept serving that old copy
        # after every deploy -- until it was reloaded, often twice -- so
        # fixes looked as if they had not shipped. The app needs the API on
        # every screen, so the offline cache bought nothing in return.
        run: >
          flutter build web --release
          --pwa-strategy=none
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=MERCHANT_WEB_URL=${{ env.MERCHANT_WEB_URL }}
          --dart-define=CUSTOMER_WEB_URL=${{ env.CUSTOMER_WEB_URL }}
          --dart-define=APP_ENV=production

      - name: Version the bundle URLs so browsers fetch every new deploy
        # The site is served with no Cache-Control header, so each browser
        # keeps main.dart.js and flutter_bootstrap.js on its own heuristic --
        # and a phone that had opened the app before went on running the old
        # build after a deploy until its cache was cleared by hand. Giving
        # both files a query string that changes with every commit makes each
        # deploy a brand-new URL the browser has never cached. index.html is
        # revalidated on any reload, so reopening the app is enough from here
        # on. The greps fail the job loudly if a Flutter upgrade ever changes
        # the loader's shape, rather than silently publishing an uncached
        # build again. (CanvasKit needs nothing: the loader fetches it from
        # gstatic under the engine revision already.)
        run: |
          set -e
          v="${GITHUB_SHA:0:12}"
          sed -i "s|\"mainJsPath\":\"main.dart.js\"|\"mainJsPath\":\"main.dart.js?v=${v}\"|" build/web/flutter_bootstrap.js
          grep -q "main.dart.js?v=${v}" build/web/flutter_bootstrap.js
          sed -i "s|src=\"flutter_bootstrap.js\"|src=\"flutter_bootstrap.js?v=${v}\"|" build/web/index.html
          grep -q "flutter_bootstrap.js?v=${v}" build/web/index.html

      - name: Publish to build_branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          publish_dir=$(mktemp -d)
          cp -r build/web/. "$publish_dir"/

          cd "$publish_dir"
          git init -q
          git checkout -q -b build_branch
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA:0:7} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin build_branch
