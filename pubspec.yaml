name: customer
description: "Town Shoppy customer mobile application"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  dio: ^5.11.0
  go_router: ^17.0.0
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.2
  mobile_scanner: ^7.1.4
  qr_flutter: ^4.1.0
  geocoding: ^5.0.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.3
  # Business mode (merchant registration / branch address): draggable map
  # pin on OpenStreetMap tiles -- the same Leaflet behaviour the merchant
  # web app has, with no API key or billing. latlong2 is flutter_map's
  # coordinate type.
  # Pinned below the latest majors on purpose: the app (and its CI publish
  # workflow) builds on Flutter 3.32 / Dart 3.8, and newer releases of these
  # require Dart 3.9+.
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  # Business mode: logo / cover / offer / prize image uploads to
  # POST /uploads/image.
  image_picker: ^1.1.2
  # Business mode (Android only): native in-app subscription checkout.
  # iOS and the web build keep the browser hand-off to the merchant web
  # app (Apple's In-App Purchase rule for digital subscriptions doesn't
  # apply to Android or to a plain website) -- see
  # subscription_checkout_controller.dart.
  razorpay_flutter: ^1.4.6
  # Push notifications (Android/iOS; no-op on the web build -- see
  # push_notification_service.dart). Firebase.initializeApp() is wrapped
  # in a try/catch so a build with no google-services.json/
  # GoogleService-Info.plist yet (this repo doesn't have one until a
  # Firebase project is created) still runs normally with push silently
  # disabled, exactly like every other "stub until configured" integration
  # in this app.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# firebase_core_web 3.11.0 (a transitive dep pulled in by the approved
# firebase_core) ships a genuine `dart:js_interop` typing bug -- calls
# `e.isA<JSObject>()` on a value whose static type is plain `Object`, which
# fails to compile with BOTH dart2js (`flutter build web`) and DDC
# (`flutter run -d chrome`) on this project's pinned Dart 3.8.1. Pinned back
# to the last version published before this regression until upstream ships
# a fix -- verified 3.10.0 compiles cleanly for both targets.
dependency_overrides:
  firebase_core_web: 3.10.0

# Launcher icon generation: `dart run flutter_launcher_icons`. The source
# PNG already has rounded, transparent corners; on Android the adaptive
# foreground is inset so the launcher's own mask never clips the bag.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#FF6F1E"
  adaptive_icon_foreground: "assets/images/icon.png"
  adaptive_icon_foreground_inset: 18

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/townshoppy_logo.png
    - assets/illustrations/

  # Caveat (SIL Open Font License, see assets/fonts/OFL-Caveat.txt) -- the
  # handwritten script used only for the auth screens' decorative taglines.
  # Bundled as a .ttf asset rather than pulling in google_fonts (see
  # AppTypography's docblock for why this app avoids that package).
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-VariableFont_wght.ttf
    # Plus Jakarta Sans (SIL Open Font License, see
    # assets/fonts/OFL-PlusJakartaSans.txt) -- the app's UI typeface, taken
    # from the Google Stitch redesign. Static weights rather than the
    # variable font so FontWeight maps to a real cut on every platform.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
